<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTELLIGESTURE - Gesture Telematics</title>
    
    <!-- MediaPipe & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <!-- Paho MQTT via WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --bg-dark: #0a0d14;
            --card-bg: rgba(18, 24, 38, 0.85);
            --border: #1f2a44;
            --accent-cyan: #00f2fe;
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --accent-blue: #2979ff;
            --accent-orange: #ff9100;
            --text-main: #f0f4f8;
            --text-dim: #8292a2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.25s ease;
        }

        body.night-light-on {
            background-color: #ffffff !important;
            box-shadow: inset 0 0 180px 90px #ffffff;
            color: #0f172a !important;
        }

        body.night-light-on header h1 { color: #0284c7 !important; }
        body.night-light-on header p { color: #475569 !important; }
        body.night-light-on .panel,
        body.night-light-on .video-card {
            background: #ffffff !important;
            border: 2px solid #cbd5e1 !important;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1) !important;
        }
        body.night-light-on .command-display {
            background: #f8fafc !important;
            border-color: #cbd5e1 !important;
        }
        body.night-light-on .telemetry-row { border-bottom: 1px dashed #cbd5e1 !important; }
        body.night-light-on .telemetry-val { color: #0f172a !important; }
        body.night-light-on .pad-btn {
            background: #f1f5f9 !important;
            color: #334155 !important;
            border-color: #cbd5e1 !important;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .video-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            max-width: 640px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        video { display: none; }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .status-badge {
            position: absolute;
            top: 28px;
            left: 28px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-red);
        }

        .dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button.start-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border: none;
            color: #050b14;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button.start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
        }

        button.tool-btn {
            background: #192338;
            border: 1px solid var(--border);
            color: var(--accent-cyan);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
        }

        button.tool-btn:hover {
            background: #223150;
            border-color: var(--accent-cyan);
        }

        .command-display {
            text-align: center;
            padding: 16px;
            background: #0f1624;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s ease;
            min-height: 96px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .command-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .command-value {
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .command-value.warning-subtext {
            font-size: 1.15rem !important;
            letter-spacing: 1px;
            line-height: 1.35;
        }

        .cmd-FORWARD { color: var(--accent-green) !important; text-shadow: 0 0 15px rgba(0, 230, 118, 0.5) !important; }
        .cmd-BACKWARD { color: var(--accent-orange) !important; text-shadow: 0 0 15px rgba(255, 145, 0, 0.5) !important; }
        .cmd-STOP { color: var(--accent-red) !important; text-shadow: 0 0 15px rgba(255, 23, 68, 0.5) !important; }
        .cmd-LEFT, .cmd-RIGHT { color: var(--accent-blue) !important; text-shadow: 0 0 15px rgba(41, 121, 255, 0.5) !important; }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 8px;
            max-width: 230px;
            margin: 0 auto;
        }

        .pad-btn {
            background: #141c2e;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 12px 4px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 0.82rem;
            transition: all 0.15s ease;
        }

        .pad-btn.active {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .pad-btn.active.cmd-FORWARD {
            background: var(--accent-green) !important;
            color: #000 !important;
            box-shadow: 0 0 12px var(--accent-green) !important;
        }

        .pad-btn.active.cmd-BACKWARD {
            background: var(--accent-orange) !important;
            color: #000 !important;
            box-shadow: 0 0 12px var(--accent-orange) !important;
        }

        .pad-btn.active.cmd-STOP {
            background: var(--accent-red) !important;
            color: #fff !important;
            box-shadow: 0 0 12px var(--accent-red) !important;
        }

        .pad-placeholder { visibility: hidden; }

        .telemetry {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--text-dim);
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .telemetry-val {
            font-family: monospace;
            color: var(--text-main);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>INTELLIGESTURE CONTROLLER</h1>
        <p>Active Obstacle Intercept & Spatial Telematics</p>
    </header>

    <div class="dashboard">
        <div class="video-card">
            <div class="canvas-container">
                <video id="webcam" playsinline></video>
                <canvas id="output_canvas"></canvas>
            </div>
            <div class="status-badge">
                <div class="dot" id="status-dot"></div>
                <span id="status-text">Camera Inactive</span>
            </div>
        </div>

        <div class="panel">
            <div class="btn-group">
                <button class="start-btn" id="start-btn" onclick="toggleCamera()">Start Camera</button>
                <button class="tool-btn" id="calib-btn" onclick="calibratePosture()">Set Current as Normal (Center)</button>
                <button class="tool-btn" id="night-btn" onclick="toggleNightLight()">💡 Night Light: OFF</button>
            </div>

            <div class="command-display" id="command-box">
                <div class="command-title">Current Action</div>
                <div class="command-value" id="command-text">STOP</div>
            </div>

            <div class="d-pad">
                <div class="pad-placeholder"></div>
                <div class="pad-btn" id="pad-forward">▲ FWD</div>
                <div class="pad-placeholder"></div>
                
                <div class="pad-btn" id="pad-left">◀ LEFT</div>
                <div class="pad-btn" id="pad-stop">■ STOP</div>
                <div class="pad-btn" id="pad-right">RIGHT ▶</div>

                <div class="pad-placeholder"></div>
                <div class="pad-btn" id="pad-backward">▼ REV</div>
                <div class="pad-placeholder"></div>
            </div>

            <div class="telemetry">
                <div class="telemetry-row">
                    <span>MQTT Broker:</span>
                    <span class="telemetry-val" id="val-mqtt" style="color: #ff1744;">Disconnected</span>
                </div>
                <div class="telemetry-row">
                    <span>Sensor Feedback:</span>
                    <span class="telemetry-val" id="val-sensor" style="color: var(--accent-green);">CLEAR</span>
                </div>
                <div class="telemetry-row">
                    <span>Drive State:</span>
                    <span class="telemetry-val" id="val-mode" style="color: var(--accent-red);">STOPPED</span>
                </div>
                <div class="telemetry-row">
                    <span>Eye Status:</span>
                    <span class="telemetry-val" id="val-eye">OPEN</span>
                </div>
                <div class="telemetry-row">
                    <span>Horizontal Turn:</span>
                    <span class="telemetry-val" id="val-yaw">CENTER</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const commandText = document.getElementById('command-text');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');
        const calibBtn = document.getElementById('calib-btn');
        const nightBtn = document.getElementById('night-btn');

        const valMqtt = document.getElementById('val-mqtt');
        const valSensor = document.getElementById('val-sensor');
        const valMode = document.getElementById('val-mode');
        const valEye = document.getElementById('val-eye');
        const valYaw = document.getElementById('val-yaw');

        const padForward = document.getElementById('pad-forward');
        const padBackward = document.getElementById('pad-backward');
        const padLeft = document.getElementById('pad-left');
        const padRight = document.getElementById('pad-right');
        const padStop = document.getElementById('pad-stop');

        let camera = null;
        let isRunning = false;
        let isNightLightOn = false;

        let baselineYaw = 0.50;
        let baselinePitch = 0.58; 

        let smoothEAR = 0.25;
        let smoothYaw = 0.50;
        let smoothPitch = 0.58;
        const SMOOTH_FACTOR = 0.35;

        let isCruising = false;
        let eyeClosedStartTime = null;
        const EYE_STOP_THRESHOLD_MS = 1200;

        // Hardware Sensor State
        let obstacleDetected = false;

        let activeCommand = "STOP";
        let lastSentAction = "";

        function toggleNightLight() {
            isNightLightOn = !isNightLightOn;
            document.body.classList.toggle('night-light-on', isNightLightOn);
            nightBtn.textContent = isNightLightOn ? "💡 Night Light: ON" : "💡 Night Light: OFF";
            nightBtn.style.color = isNightLightOn ? "var(--accent-green)" : "var(--accent-cyan)";
        }

        function calibratePosture() {
            if (!isRunning) return;
            baselineYaw = smoothYaw;
            baselinePitch = smoothPitch;
            calibBtn.textContent = "Position Calibrated!";
            calibBtn.style.color = "var(--accent-green)";
            setTimeout(() => {
                calibBtn.textContent = "Set Current as Normal (Center)";
                calibBtn.style.color = "var(--accent-cyan)";
            }, 1800);
        }

        // --- MQTT CONFIGURATION ---
        const MQTT_BROKER = "broker.hivemq.com";
        const MQTT_PORT = 8884; 
        const MQTT_CMD_TOPIC = "uem/gesture_robot/cmd_alpha99";         // Browser -> ESP32
        const MQTT_FEEDBACK_TOPIC = "uem/gesture_robot/status_alpha99"; // ESP32 -> Browser
        const CLIENT_ID = "web_telemetry_" + Math.random().toString(16).substring(2, 10);

        let mqttClient = null;

        function initMQTT() {
            try {
                mqttClient = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, "/mqtt", CLIENT_ID);

                mqttClient.onConnectionLost = () => {
                    valMqtt.textContent = "Disconnected";
                    valMqtt.style.color = "var(--accent-red)";
                    setTimeout(initMQTT, 3000);
                };

                mqttClient.onMessageArrived = (message) => {
                    if (message.destinationName === MQTT_FEEDBACK_TOPIC) {
                        const payload = message.payloadString.trim().toUpperCase();
                        
                        if (payload === "OBSTACLE" || payload === "BLOCKED" || payload === "1") {
                            obstacleDetected = true;
                            isCruising = false; // Disengage forward cruise
                            valSensor.textContent = "OBJECT IN FRONT";
                            valSensor.style.color = "var(--accent-red)";
                        } else if (payload === "CLEAR" || payload === "0") {
                            obstacleDetected = false;
                            valSensor.textContent = "CLEAR";
                            valSensor.style.color = "var(--accent-green)";
                        }
                    }
                };

                mqttClient.connect({
                    useSSL: true,
                    timeout: 4,
                    onSuccess: () => {
                        valMqtt.textContent = "Connected";
                        valMqtt.style.color = "var(--accent-green)";
                        mqttClient.subscribe(MQTT_FEEDBACK_TOPIC);
                    },
                    onFailure: () => {
                        valMqtt.textContent = "Failed";
                        valMqtt.style.color = "var(--accent-red)";
                        setTimeout(initMQTT, 6000);
                    }
                });
            } catch (e) {
                console.error("MQTT Init Error:", e);
            }
        }

        function sendCommandOverMQTT(action) {
            if (!mqttClient || !mqttClient.isConnected()) return;

            if (action !== lastSentAction) {
                const message = new Paho.MQTT.Message(action);
                message.destinationName = MQTT_CMD_TOPIC;
                message.qos = 0;
                message.retained = false;
                mqttClient.send(message);
                lastSentAction = action;
            }
        }

        initMQTT();

        function getDistance(pt1, pt2) {
            return Math.hypot(pt1.x - pt2.x, pt1.y - pt2.y);
        }

        function getEyeAspectRatio(landmarks, topIdx, bottomIdx, leftIdx, rightIdx) {
            const v = getDistance(landmarks[topIdx], landmarks[bottomIdx]);
            const h = getDistance(landmarks[leftIdx], landmarks[rightIdx]);
            return v / h;
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        function onResults(results) {
            if (!videoElement.videoWidth) return;

            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            } else {
                canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                const leftEAR = getEyeAspectRatio(landmarks, 159, 145, 33, 133);
                const rightEAR = getEyeAspectRatio(landmarks, 386, 374, 362, 263);
                const rawEAR = (leftEAR + rightEAR) / 2;

                const noseX = landmarks[1].x;
                const rightEdgeX = landmarks[234].x;
                const leftEdgeX = landmarks[454].x;
                const faceWidth = Math.abs(leftEdgeX - rightEdgeX);
                const rawYaw = (noseX - rightEdgeX) / faceWidth;

                const topForeheadY = landmarks[10].y;
                const bottomChinY = landmarks[152].y;
                const noseY = landmarks[1].y;
                const faceHeight = Math.abs(bottomChinY - topForeheadY);
                const rawPitch = (noseY - topForeheadY) / faceHeight;

                smoothEAR = smoothEAR * (1 - SMOOTH_FACTOR) + rawEAR * SMOOTH_FACTOR;
                smoothYaw = smoothYaw * (1 - SMOOTH_FACTOR) + rawYaw * SMOOTH_FACTOR;
                smoothPitch = smoothPitch * (1 - SMOOTH_FACTOR) + rawPitch * SMOOTH_FACTOR;

                const yawDelta = smoothYaw - baselineYaw;
                const pitchDelta = smoothPitch - baselinePitch;

                const YAW_DEADZONE = 0.11;
                const PITCH_UP_DEADZONE = 0.10;
                const PITCH_DOWN_DEADZONE = 0.14;

                // 1. Long Eye Closure Tracking (Deliberate Stop)
                const eyesCurrentlyClosed = smoothEAR < 0.17;
                let eyesTriggeredStop = false;

                if (eyesCurrentlyClosed) {
                    if (!eyeClosedStartTime) eyeClosedStartTime = performance.now();
                    const closedDuration = performance.now() - eyeClosedStartTime;
                    
                    if (closedDuration >= EYE_STOP_THRESHOLD_MS) {
                        isCruising = false;
                        eyesTriggeredStop = true;
                        valEye.textContent = "STOP TRIGGERED";
                        valEye.style.color = "var(--accent-red)";
                    } else {
                        valEye.textContent = "CLOSING...";
                        valEye.style.color = "var(--accent-cyan)";
                    }
                } else {
                    eyeClosedStartTime = null;
                    valEye.textContent = "OPEN";
                    valEye.style.color = "var(--text-main)";
                }

                // 2. Pitch State Evaluation
                if (pitchDelta < -PITCH_UP_DEADZONE && !eyesCurrentlyClosed) {
                    // Head UP: Ignites forward cruise only if path is clear
                    if (!obstacleDetected) {
                        isCruising = true;
                    }
                } else if (pitchDelta > PITCH_DOWN_DEADZONE && !eyesCurrentlyClosed) {
                    // Head DOWN: Disengages cruise
                    isCruising = false;
                }

                // 3. Directional Arbitration
                let detectedAction = "STOP";

                if (eyesTriggeredStop) {
                    detectedAction = "STOP";
                } else if (pitchDelta > PITCH_DOWN_DEADZONE) {
                    // Head DOWN -> BACKWARD (always available)
                    detectedAction = "BACKWARD";
                } else if (yawDelta > YAW_DEADZONE) {
                    // Head LEFT -> LEFT (always available)
                    detectedAction = "LEFT";
                } else if (yawDelta < -YAW_DEADZONE) {
                    // Head RIGHT -> RIGHT (always available)
                    detectedAction = "RIGHT";
                } else if (isCruising && !obstacleDetected) {
                    // Head NEUTRAL while cruising forward -> FORWARD
                    detectedAction = "FORWARD";
                } else {
                    // Neutral when stopped or when blocked by obstacle -> STOP
                    detectedAction = "STOP";
                }

                activeCommand = detectedAction;

                // Update Telemetry & UI
                valMode.textContent = isCruising ? "CRUISING (FWD)" : (detectedAction === "BACKWARD" ? "REVERSING" : "STOPPED");
                valMode.style.color = isCruising ? "var(--accent-green)" : (detectedAction === "BACKWARD" ? "var(--accent-orange)" : "var(--accent-red)");
                valYaw.textContent = (yawDelta > YAW_DEADZONE) ? "LEFT" : ((yawDelta < -YAW_DEADZONE) ? "RIGHT" : "CENTER");

                updateCommandUI(activeCommand, obstacleDetected);
                sendCommandOverMQTT(activeCommand);

                drawTrackerPoints(landmarks);
            } else {
                isCruising = false;
                updateCommandUI("STOP", obstacleDetected);
                sendCommandOverMQTT("STOP");
                valMode.textContent = "STOPPED";
                valMode.style.color = "var(--accent-red)";
                valEye.textContent = "--";
                valYaw.textContent = "--";
            }
            canvasCtx.restore();
        }

        function drawTrackerPoints(landmarks) {
            const pointsToHighlight = [1, 10, 152, 159, 145, 386, 374, 234, 454];
            canvasCtx.fillStyle = '#00f2fe';
            pointsToHighlight.forEach(idx => {
                const pt = landmarks[idx];
                canvasCtx.beginPath();
                canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 3, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function updateCommandUI(cmd, isBlocked) {
            commandText.className = 'command-value';
            
            padForward.classList.remove('active', 'cmd-FORWARD');
            padBackward.classList.remove('active', 'cmd-BACKWARD');
            padLeft.classList.remove('active');
            padRight.classList.remove('active');
            padStop.classList.remove('active', 'cmd-STOP');

            if (cmd === 'STOP') {
                if (isBlocked) {
                    commandText.textContent = "STOP (OBJECT OR WALL IN FRONT)";
                    commandText.classList.add('cmd-STOP', 'warning-subtext');
                } else {
                    commandText.textContent = 'STOP';
                    commandText.classList.add('cmd-STOP');
                }
                padStop.classList.add('active', 'cmd-STOP');
            } else if (cmd === 'FORWARD') {
                commandText.textContent = 'FORWARD';
                commandText.classList.add('cmd-FORWARD');
                padForward.classList.add('active', 'cmd-FORWARD');
            } else if (cmd === 'BACKWARD') {
                commandText.textContent = 'BACKWARD';
                commandText.classList.add('cmd-BACKWARD');
                padBackward.classList.add('active', 'cmd-BACKWARD');
            } else if (cmd === 'LEFT') {
                commandText.textContent = 'LEFT';
                commandText.classList.add('cmd-LEFT');
                padLeft.classList.add('active');
            } else if (cmd === 'RIGHT') {
                commandText.textContent = 'RIGHT';
                commandText.classList.add('cmd-RIGHT');
                padRight.classList.add('active');
            }
        }

        async function toggleCamera() {
            if (!isRunning) {
                try {
                    statusText.textContent = "Loading Model...";
                    camera = new Camera(videoElement, {
                        onFrame: async () => { await faceMesh.send({ image: videoElement }); },
                        width: 640,
                        height: 480
                    });
                    await camera.start();
                    isRunning = true;
                    statusDot.classList.add('active');
                    statusText.textContent = "Live Tracking";
                    startBtn.textContent = "Stop Camera";
                    startBtn.style.background = "#ff1744";
                } catch (err) {
                    alert("Webcam error. Ensure permissions are granted!");
                    statusText.textContent = "Camera Error";
                }
            } else {
                if (camera) await camera.stop();
                isRunning = false;
                isCruising = false;
                statusDot.classList.remove('active');
                statusText.textContent = "Camera Inactive";
                startBtn.textContent = "Start Camera";
                startBtn.style.background = "";
                updateCommandUI("STOP", obstacleDetected);
                sendCommandOverMQTT("STOP");
            }
        }
    </script>
</body>
</html>
